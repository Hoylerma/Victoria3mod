l_korean:
 je_group_berater: "Advisor"
 je_berater: "The Advisor"
 je_berater_reason: "Your advisor keeps a constant eye on your country's budget, population, politics, market and diplomacy and tells you where things go wrong and what you can do about it. Critical problems and warnings also show up live in the alert bar at the top.\n\nSpecific instructions are one click away: the #bold construction plan#! tells you what to build in which state, the #bold law plan#! which laws to pass next."
 je_berater_status_kopf: "Current assessment:"
 je_berater_status_alles_gut: "\nNo problems found. Keep it up!"
 berater_knopf_bericht: "Situation Report"
 berater_knopf_bericht_desc: "Your advisor sums up all findings with advice and names the affected states and interest groups."
 berater_knopf_bauplan: "Construction Plan"
 berater_knopf_bauplan_desc: "Your advisor tells you which buildings to build in which state."
 berater_knopf_gesetzesplan: "Law Plan"
 berater_knopf_gesetzesplan_desc: "Your advisor recommends your next laws and tells you whether your government backs them."
 berater_knopf_jahresbericht_an: "Yearly report: on"
 berater_knopf_jahresbericht_aus: "Yearly report: off"
 berater_knopf_jahresbericht_desc: "Turns the automatic yearly situation report on or off."
 berater_knopf_krisen_an: "Crisis warnings: on"
 berater_knopf_krisen_aus: "Crisis warnings: off"
 berater_knopf_krisen_desc: "Turns the popup warning for critical problems on or off. It appears at most every six months."
 berater.1.t: "The Advisor's Situation Report"
 berater.1.d: "Your Excellency, here is my assessment of our country's situation."
 berater.1.f: "“To govern is to foresee.”"
 berater.1.a: "Thank you, I will see to it."
 berater.2.t: "The Advisor Sounds the Alarm"
 berater.2.d: "Your Excellency, forgive the interruption, but this cannot wait:"
 berater.2.f: "Critical problems are also shown live in the alert bar. This warning appears at most every six months."
 berater.2.a: "Understood."
 berater.2.b: "Show me the full situation report."
 berater.2.c: "No more crisis warnings."
 berater.3.t: "The Advisor's Construction Plan"
 berater.3.d: "Your Excellency, these projects would help our country most right now. For each one I picked the state where the building is possible and the most workers are available."
 berater.3.f: "Prices and states reflect the moment the plan was made. Request a new one from the journal at any time."
 berater.3.a: "I will queue the construction."
 berater.4.t: "The Advisor's Law Plan"
 berater.4.d: "Your Excellency, these are the reforms I would pursue next."
 berater.4.f: "A law passes more easily when powerful interest groups in the government support it."
 berater.4.a: "I will set it in motion."
 berater_zeige_lagebericht: "Show me the situation report."
 berater_zeige_bauplan: "Show me the construction plan."
 berater_zeige_gesetzesplan: "Show me the law plan."
 berater_bericht_kopf_kritisch: "\n\n#bold CRITICAL PROBLEMS#!"
 berater_bericht_kopf_warnung: "\n\n#bold WARNINGS#!"
 berater_bericht_kopf_tipp: "\n\n#bold TIPS#!"
 berater_bericht_alles_gut: "\n\nI see no problems at the moment. Our country is in good shape, Your Excellency."
 berater_bericht_rat: "Advice"
 berater_bericht_hinweis_plaene: "\n\nWhat exactly to build where and which laws to pass is in the #bold construction plan#! and the #bold law plan#!."
 berater_warnung_aktion: "More in the journal under “The Advisor”."
 berater_bauplan_kopf_gueter: "\n\n#bold EXPENSIVE GOODS – PRODUCE THEM YOURSELF#!"
 berater_bauplan_kopf_infrastruktur: "\n\n#bold INFRASTRUCTURE#!"
 berater_bauplan_kopf_staat: "\n\n#bold ADMINISTRATION AND CONSTRUCTION#!"
 berater_bauplan_verwaltung: "\n• Your bureaucracy is insufficient. Recommended: #bold [GetBuildingType('building_government_administration').GetName]#! in #bold [SCOPE.sState('berater_ort_verwaltung').GetName]#!."
 berater_bauplan_bausektor: "\n• Your construction queue is long and your budget is in surplus, so more construction capacity pays off. Recommended: #bold [GetBuildingType('building_construction_sector').GetName]#! in #bold [SCOPE.sState('berater_ort_bausektor').GetName]#!."
 berater_bauplan_nichts: "\n\nNo construction is urgent right now. Prices are reasonable and infrastructure is sufficient. Invest in construction sectors, universities or the industry your country does best."
 berater_gesetzplan_aktuell: "\n\n#bold IN PROGRESS#!\n• You are enacting #bold [SCOPE.sLaw('berater_gesetz_aktuell').GetName]#!. See it through before starting a new law."
 berater_gesetzplan_kopf_empfehlung: "\n\n#bold RECOMMENDATIONS#!"
 berater_gesetzplan_kopf_regierung: "\n\n#bold BACKED BY YOUR GOVERNMENT#!\nYou can introduce these laws now without any governing party opposing them:"
 berater_gesetzplan_unterstuetzt: " #G Your government backs this.#!"
 berater_gesetzplan_umstritten: " #Y Your government lacks support for this: bring in interest groups that favor the law.#!"
 berater_gesetzplan_nichts: "\n\nI have no law to recommend right now. Your laws fit the situation, or the next reforms have not been researched yet."
 berater_gesetzplan_warten: "\n\nOnce the current law has passed, I can recommend more."
 berater_detail_einleitung: "\n"
 ag_berater_tipps_name: "Advisor's Tips"
 ag_berater_tipps_desc: "Suggestions from your advisor"
 ag_berater_tipps_tooltip: "Your advisor has suggestions on what you could do better."
 je_berater_status_bankrott: "\n• Critical: State Bankruptcy"
 berater_bericht_bankrott: "\n\n• #bold State Bankruptcy#!\nYour state is in default. Construction stalls, salaries go unpaid and interest groups lose faith in the government.\nAdvice: Raise taxes or tariffs immediately, lower government and military wages, demobilize unneeded troops and cut subsidies. Pause unprofitable construction until your weekly balance is positive again."
 alert_berater_bankrott_name: "State Bankruptcy"
 alert_berater_bankrott_desc: "Your state is in default. Construction stalls, salaries go unpaid and interest groups lose faith in the government."
 alert_berater_bankrott_hint: "Advice: Raise taxes or tariffs immediately, lower government and military wages, demobilize unneeded troops and cut subsidies. Pause unprofitable construction until your weekly balance is positive again."
 alert_berater_bankrott_action: "More in the journal under “The Advisor”."
 berater_bankrott_setting_name: "The Advisor: State Bankruptcy"
 je_berater_status_schulden_kritisch: "\n• Critical: Debt at the Limit"
 berater_bericht_schulden_kritisch: "\n\n• #bold Debt at the Limit#!\nYour debt has passed 80 % of your credit limit. At 100 % you will default.\nAdvice: Get the budget into surplus now: raise taxes or tariffs, lower wages and postpone expensive construction. Every further loan increases your interest payments."
 alert_berater_schulden_kritisch_name: "Debt at the Limit"
 alert_berater_schulden_kritisch_desc: "Your debt has passed 80 % of your credit limit. At 100 % you will default."
 alert_berater_schulden_kritisch_hint: "Advice: Get the budget into surplus now: raise taxes or tariffs, lower wages and postpone expensive construction. Every further loan increases your interest payments."
 alert_berater_schulden_kritisch_action: "More in the journal under “The Advisor”."
 berater_schulden_kritisch_setting_name: "The Advisor: Debt at the Limit"
 je_berater_status_revolution: "\n• Critical: Revolution Looming"
 berater_bericht_revolution: "\n\n• #bold Revolution Looming#!\nAt least one political movement has turned revolutionary. If it gathers enough support, a civil war will break out.\nAdvice: Give in by enacting a law the movement wants, or weaken it: suppress the supporting interest groups, raise the standard of living and drop laws it opposes. Keep your army ready."
 alert_berater_revolution_name: "Revolution Looming"
 alert_berater_revolution_desc: "At least one political movement has turned revolutionary. If it gathers enough support, a civil war will break out."
 alert_berater_revolution_hint: "Advice: Give in by enacting a law the movement wants, or weaken it: suppress the supporting interest groups, raise the standard of living and drop laws it opposes. Keep your army ready."
 alert_berater_revolution_action: "More in the journal under “The Advisor”."
 berater_revolution_setting_name: "The Advisor: Revolution Looming"
 je_berater_status_kriegsunterstuetzung: "\n• Critical: War Support Below Zero"
 berater_bericht_kriegsunterstuetzung: "\n\n• #bold War Support Below Zero#!\nIn at least one war your country's war support has dropped below zero. At -100 you will be forced to capitulate.\nAdvice: Offer peace with few war goals now, or accept a reasonable offer, before you are forced to capitulate. Occupying enemy war goals stabilizes your own war support."
 alert_berater_kriegsunterstuetzung_name: "War Support Below Zero"
 alert_berater_kriegsunterstuetzung_desc: "In at least one war your country's war support has dropped below zero. At -100 you will be forced to capitulate."
 alert_berater_kriegsunterstuetzung_hint: "Advice: Offer peace with few war goals now, or accept a reasonable offer, before you are forced to capitulate. Occupying enemy war goals stabilizes your own war support."
 alert_berater_kriegsunterstuetzung_action: "More in the journal under “The Advisor”."
 berater_kriegsunterstuetzung_setting_name: "The Advisor: War Support Below Zero"
 je_berater_status_infamie_paria: "\n• Critical: Pariah State"
 berater_bericht_infamie_paria: "\n\n• #bold Pariah State#!\nYour infamy is so high that other powers will use any pretext to move against you.\nAdvice: Stop all further conquests and aggressive demands until your infamy has dropped. Look for allies and defensive pacts."
 alert_berater_infamie_paria_name: "Pariah State"
 alert_berater_infamie_paria_desc: "Your infamy is so high that other powers will use any pretext to move against you."
 alert_berater_infamie_paria_hint: "Advice: Stop all further conquests and aggressive demands until your infamy has dropped. Look for allies and defensive pacts."
 alert_berater_infamie_paria_action: "More in the journal under “The Advisor”."
 berater_infamie_paria_setting_name: "The Advisor: Pariah State"
 je_berater_status_schulden_hoch: "\n• Warning: High National Debt"
 berater_bericht_schulden_hoch: "\n\n• #bold High National Debt#!\nYour debt is more than half of your credit limit. Interest payments weigh ever more heavily on the budget.\nAdvice: Aim for a budget surplus to pay down the debt: raise taxes moderately, review your expenses and only continue high-yield construction (industry, mining, railways)."
 alert_berater_schulden_hoch_name: "High National Debt"
 alert_berater_schulden_hoch_desc: "Your debt is more than half of your credit limit. Interest payments weigh ever more heavily on the budget."
 alert_berater_schulden_hoch_hint: "Advice: Aim for a budget surplus to pay down the debt: raise taxes moderately, review your expenses and only continue high-yield construction (industry, mining, railways)."
 alert_berater_schulden_hoch_action: "More in the journal under “The Advisor”."
 berater_schulden_hoch_setting_name: "The Advisor: High National Debt"
 je_berater_status_defizit: "\n• Warning: Budget Deficit"
 berater_bericht_defizit: "\n\n• #bold Budget Deficit#!\nYour state spends more each week than it earns, and your gold reserves are nearly gone. Soon you will have to take on debt.\nAdvice: Raise taxes or tariffs, lower government or military wages, or reduce construction spending. Also review expensive laws such as subsidies and welfare programs."
 alert_berater_defizit_name: "Budget Deficit"
 alert_berater_defizit_desc: "Your state spends more each week than it earns, and your gold reserves are nearly gone. Soon you will have to take on debt."
 alert_berater_defizit_hint: "Advice: Raise taxes or tariffs, lower government or military wages, or reduce construction spending. Also review expensive laws such as subsidies and welfare programs."
 alert_berater_defizit_action: "More in the journal under “The Advisor”."
 berater_defizit_setting_name: "The Advisor: Budget Deficit"
 je_berater_status_buerokratie: "\n• Warning: Negative Bureaucracy"
 berater_bericht_buerokratie: "\n\n• #bold Negative Bureaucracy#!\nYou use more bureaucracy than your administration produces. This lowers tax income and slows down the incorporation of new states.\nAdvice: Build government administrations in states with many educated workers, postpone laws and institutions with high bureaucracy costs, or choose better production methods for your administrations."
 je_berater_status_autoritaet: "\n• Warning: Negative Authority"
 berater_bericht_autoritaet: "\n\n• #bold Negative Authority#!\nDecrees, tariffs and laws consume more authority than you have. Every use of authority loses effectiveness as a result.\nAdvice: Revoke less important decrees, restrict tariffs and trade policies to fewer goods, or increase authority through laws and technologies."
 je_berater_status_einfluss: "\n• Warning: Negative Influence"
 berater_bericht_einfluss: "\n\n• #bold Negative Influence#!\nYour diplomatic commitments cost more influence than you produce. This weakens your diplomacy.\nAdvice: Cancel unimportant pacts and drop interests in regions you do not need. Increase influence through laws, technologies and a higher rank."
 je_berater_status_unruhe: "\n• Warning: Turmoil in Your States"
 berater_bericht_unruhe: "\n\n• #bold Turmoil in Your States#!\nAt least one of your states is in serious turmoil. This lowers productivity and can lead to uprisings.\nAdvice: Inspect the affected states in the population view: unemployment, a low standard of living and discriminated cultures are the most common causes. Create jobs and improve the supply of basic goods."
 berater_bericht_unruhe_detail: "\nMost affected: #bold [SCOPE.sState('berater_ort_unruhe').GetName]#!."
 alert_berater_unruhe_name: "Turmoil in Your States"
 alert_berater_unruhe_desc: "At least one of your states is in serious turmoil. This lowers productivity and can lead to uprisings."
 alert_berater_unruhe_hint: "Advice: Inspect the affected states in the population view: unemployment, a low standard of living and discriminated cultures are the most common causes. Create jobs and improve the supply of basic goods."
 alert_berater_unruhe_action: "More in the journal under “The Advisor”."
 berater_unruhe_setting_name: "The Advisor: Turmoil in Your States"
 je_berater_status_radikale: "\n• Warning: Many Radicals"
 berater_bericht_radikale: "\n\n• #bold Many Radicals#!\nMore than 20 % of your population is radical. Radicals strengthen revolutionary movements and weaken the government.\nAdvice: Raise the standard of living (cheaper basic goods, higher wages), lower the tax burden on the lower strata and address the demands of unhappy interest groups."
 alert_berater_radikale_name: "Many Radicals"
 alert_berater_radikale_desc: "More than 20 % of your population is radical. Radicals strengthen revolutionary movements and weaken the government."
 alert_berater_radikale_hint: "Advice: Raise the standard of living (cheaper basic goods, higher wages), lower the tax burden on the lower strata and address the demands of unhappy interest groups."
 alert_berater_radikale_action: "More in the journal under “The Advisor”."
 berater_radikale_setting_name: "The Advisor: Many Radicals"
 je_berater_status_ig_wuetend: "\n• Warning: Powerful Interest Group Angry"
 berater_bericht_ig_wuetend: "\n\n• #bold Powerful Interest Group Angry#!\nAn influential interest group is angry with your government. It may radicalize and back revolutionary movements.\nAdvice: Check in the politics view which laws the group opposes. Bring it into the government, meet one of its demands or weaken it through suppression."
 berater_bericht_ig_wuetend_detail: "\nThe angriest is #bold [SCOPE.gsInterestGroup('berater_ig_wuetend').GetName]#!."
 alert_berater_ig_wuetend_name: "Powerful Interest Group Angry"
 alert_berater_ig_wuetend_desc: "An influential interest group is angry with your government. It may radicalize and back revolutionary movements."
 alert_berater_ig_wuetend_hint: "Advice: Check in the politics view which laws the group opposes. Bring it into the government, meet one of its demands or weaken it through suppression."
 alert_berater_ig_wuetend_action: "More in the journal under “The Advisor”."
 berater_ig_wuetend_setting_name: "The Advisor: Powerful Interest Group Angry"
 je_berater_status_arbeitslosigkeit: "\n• Warning: High Unemployment"
 berater_bericht_arbeitslosigkeit: "\n\n• #bold High Unemployment#!\nIn at least one larger state more than 15 % of the workforce is unemployed. The unemployed grow poor and turn radical.\nAdvice: Build buildings there that employ many workers (agriculture, mines, factories) and whose goods are in demand. Good infrastructure and market access help."
 berater_bericht_arbeitslosigkeit_detail: "\nThe most unemployed live in #bold [SCOPE.sState('berater_ort_arbeitslos').GetName]#!. The construction plan favors such states."
 alert_berater_arbeitslosigkeit_name: "High Unemployment"
 alert_berater_arbeitslosigkeit_desc: "In at least one larger state more than 15 % of the workforce is unemployed. The unemployed grow poor and turn radical."
 alert_berater_arbeitslosigkeit_hint: "Advice: Build buildings there that employ many workers (agriculture, mines, factories) and whose goods are in demand. Good infrastructure and market access help."
 alert_berater_arbeitslosigkeit_action: "More in the journal under “The Advisor”."
 berater_arbeitslosigkeit_setting_name: "The Advisor: High Unemployment"
 je_berater_status_lebensstandard: "\n• Warning: Expectations Unmet"
 berater_bericht_lebensstandard: "\n\n• #bold Expectations Unmet#!\nMore than 30 % of your population lives below the standard of living they expect. This creates radicals.\nAdvice: Lower the price of basic goods (grain, fabric, wood, furniture) through more production or imports, and strengthen wages and welfare laws."
 alert_berater_lebensstandard_name: "Expectations Unmet"
 alert_berater_lebensstandard_desc: "More than 30 % of your population lives below the standard of living they expect. This creates radicals."
 alert_berater_lebensstandard_hint: "Advice: Lower the price of basic goods (grain, fabric, wood, furniture) through more production or imports, and strengthen wages and welfare laws."
 alert_berater_lebensstandard_action: "More in the journal under “The Advisor”."
 berater_lebensstandard_setting_name: "The Advisor: Expectations Unmet"
 je_berater_status_engpaesse: "\n• Warning: Goods Shortages"
 berater_bericht_engpaesse: "\n\n• #bold Goods Shortages#!\nYour market lacks goods that buildings need as inputs. This lowers their productivity and drives prices up.\nAdvice: The construction plan in the journal tells you what to build where. Imports through trade routes also help."
 alert_berater_engpaesse_name: "Goods Shortages"
 alert_berater_engpaesse_desc: "Your market lacks goods that buildings need as inputs. This lowers their productivity and drives prices up."
 alert_berater_engpaesse_hint: "Advice: The construction plan in the journal tells you what to build where. Imports through trade routes also help."
 alert_berater_engpaesse_action: "More in the journal under “The Advisor”."
 berater_engpaesse_setting_name: "The Advisor: Goods Shortages"
 je_berater_status_infamie_hoch: "\n• Warning: High Infamy"
 berater_bericht_infamie_hoch: "\n\n• #bold High Infamy#!\nYour infamy has reached the notorious level. Further conquests may trigger coalitions against you.\nAdvice: Pause aggressive war goals and let your infamy decay before starting your next expansion."
 alert_berater_infamie_hoch_name: "High Infamy"
 alert_berater_infamie_hoch_desc: "Your infamy has reached the notorious level. Further conquests may trigger coalitions against you."
 alert_berater_infamie_hoch_hint: "Advice: Pause aggressive war goals and let your infamy decay before starting your next expansion."
 alert_berater_infamie_hoch_action: "More in the journal under “The Advisor”."
 berater_infamie_hoch_setting_name: "The Advisor: High Infamy"
 je_berater_status_abspaltung: "\n• Warning: Secessionists Growing"
 berater_bericht_abspaltung: "\n\n• #bold Secessionists Growing#!\nA secessionist movement is growing in your country. If it becomes strong enough, a war of secession will break out.\nAdvice: Improve the situation of the affected culture: relax citizenship and culture laws, raise the standard of living and reduce turmoil in the affected states."
 alert_berater_abspaltung_name: "Secessionists Growing"
 alert_berater_abspaltung_desc: "A secessionist movement is growing in your country. If it becomes strong enough, a war of secession will break out."
 alert_berater_abspaltung_hint: "Advice: Improve the situation of the affected culture: relax citizenship and culture laws, raise the standard of living and reduce turmoil in the affected states."
 alert_berater_abspaltung_action: "More in the journal under “The Advisor”."
 berater_abspaltung_setting_name: "The Advisor: Secessionists Growing"
 je_berater_status_legitimitaet: "\n• Warning: Government Barely Legitimate"
 berater_bericht_legitimitaet: "\n\n• #bold Government Barely Legitimate#!\nYour government's legitimacy is very low. Laws are harder to pass and the government is losing support.\nAdvice: Reshuffle the government: include interest groups whose ideology fits your form of government, and rely on a few strong governing parties."
 alert_berater_legitimitaet_name: "Government Barely Legitimate"
 alert_berater_legitimitaet_desc: "Your government's legitimacy is very low. Laws are harder to pass and the government is losing support."
 alert_berater_legitimitaet_hint: "Advice: Reshuffle the government: include interest groups whose ideology fits your form of government, and rely on a few strong governing parties."
 alert_berater_legitimitaet_action: "More in the journal under “The Advisor”."
 berater_legitimitaet_setting_name: "The Advisor: Government Barely Legitimate"
 je_berater_status_forschung: "\n• Tip: No Active Research"
 berater_bericht_forschung: "\n\n• #bold No Active Research#!\nYou are not researching any technology. Every week without a research goal wastes innovation.\nAdvice: Pick a goal in the technology view. Good priorities: production technologies for your key industries, railways, and administration and education technologies."
 je_berater_status_bau_leer: "\n• Tip: Construction Idle"
 berater_bericht_bau_leer: "\n\n• #bold Construction Idle#!\nYour government construction queue is empty. The construction capacity you pay for goes unused.\nAdvice: Queue new projects: buildings for scarce or expensive goods, infrastructure in states with bottlenecks, or more construction sectors to build faster in the future."
 je_berater_status_bau_lang: "\n• Tip: Construction Queue Too Long"
 berater_bericht_bau_lang: "\n\n• #bold Construction Queue Too Long#!\nIt will take more than two years to finish all government construction projects.\nAdvice: Build additional construction sectors if your budget allows, switch to better construction production methods, or reorder the queue by priority."
 alert_berater_bau_lang_name: "Construction Queue Too Long"
 alert_berater_bau_lang_desc: "It will take more than two years to finish all government construction projects."
 alert_berater_bau_lang_hint: "Advice: Build additional construction sectors if your budget allows, switch to better construction production methods, or reorder the queue by priority."
 alert_berater_bau_lang_action: "More in the journal under “The Advisor”."
 berater_bau_lang_setting_name: "The Advisor: Construction Queue Too Long"
 je_berater_status_gold_ungenutzt: "\n• Tip: Gold Reserves Nearly Full"
 berater_bericht_gold_ungenutzt: "\n\n• #bold Gold Reserves Nearly Full#!\nYour gold reserves are close to their maximum. Any surplus beyond that is wasted.\nAdvice: Put the money to work: more construction sectors, subsidies for key industries, higher government wages or lower taxes."
 alert_berater_gold_ungenutzt_name: "Gold Reserves Nearly Full"
 alert_berater_gold_ungenutzt_desc: "Your gold reserves are close to their maximum. Any surplus beyond that is wasted."
 alert_berater_gold_ungenutzt_hint: "Advice: Put the money to work: more construction sectors, subsidies for key industries, higher government wages or lower taxes."
 alert_berater_gold_ungenutzt_action: "More in the journal under “The Advisor”."
 berater_gold_ungenutzt_setting_name: "The Advisor: Gold Reserves Nearly Full"
 je_berater_status_steuern_hoch: "\n• Tip: Taxes Could Be Lowered"
 berater_bericht_steuern_hoch: "\n\n• #bold Taxes Could Be Lowered#!\nYour taxes are high even though the budget is healthy. High taxes depress the standard of living and growth.\nAdvice: Lower the tax level by one step and watch your weekly balance. A higher standard of living brings more loyalists and growth."
 alert_berater_steuern_hoch_name: "Taxes Could Be Lowered"
 alert_berater_steuern_hoch_desc: "Your taxes are high even though the budget is healthy. High taxes depress the standard of living and growth."
 alert_berater_steuern_hoch_hint: "Advice: Lower the tax level by one step and watch your weekly balance. A higher standard of living brings more loyalists and growth."
 alert_berater_steuern_hoch_action: "More in the journal under “The Advisor”."
 berater_steuern_hoch_setting_name: "The Advisor: Taxes Could Be Lowered"
 je_berater_status_alphabetisierung: "\n• Tip: Low Literacy"
 berater_bericht_alphabetisierung: "\n\n• #bold Low Literacy#!\nLess than a quarter of your population can read. This slows research and keeps pops out of qualified professions.\nAdvice: Enact better school laws (e.g. public schools), invest in the schools institution and research education technologies."
 alert_berater_alphabetisierung_name: "Low Literacy"
 alert_berater_alphabetisierung_desc: "Less than a quarter of your population can read. This slows research and keeps pops out of qualified professions."
 alert_berater_alphabetisierung_hint: "Advice: Enact better school laws (e.g. public schools), invest in the schools institution and research education technologies."
 alert_berater_alphabetisierung_action: "More in the journal under “The Advisor”."
 berater_alphabetisierung_setting_name: "The Advisor: Low Literacy"
 je_berater_status_industriegueter_teuer: "\n• Tip: Industrial Goods Expensive"
 berater_bericht_industriegueter_teuer: "\n\n• #bold Industrial Goods Expensive#!\nAt least one key industrial good (coal, iron, wood, tools or steel) costs more than 25 % above its base price. This holds back your whole industry.\nAdvice: Open the construction plan in the journal: your advisor names the right building and the best state for each expensive good."
 alert_berater_industriegueter_teuer_name: "Industrial Goods Expensive"
 alert_berater_industriegueter_teuer_desc: "At least one key industrial good (coal, iron, wood, tools or steel) costs more than 25 % above its base price. This holds back your whole industry."
 alert_berater_industriegueter_teuer_hint: "Advice: Open the construction plan in the journal: your advisor names the right building and the best state for each expensive good."
 alert_berater_industriegueter_teuer_action: "More in the journal under “The Advisor”."
 berater_industriegueter_teuer_setting_name: "The Advisor: Industrial Goods Expensive"
 je_berater_status_gesetze: "\n• Tip: No Law Being Enacted"
 berater_bericht_gesetze: "\n\n• #bold No Law Being Enacted#!\nYou are not enacting any law right now. Reforms are among the strongest levers for the economy and stability.\nAdvice: Open the law plan in the journal: your advisor recommends specific laws and tells you whether your government backs them."
