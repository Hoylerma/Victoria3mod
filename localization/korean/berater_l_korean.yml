 berater_bauplan_infra_1: "\n• #bold [SCOPE.sState('berater_infra_1').GetName]#! needs more infrastructure than it has, which holds back every building there. Recommended: #bold [GetBuildingType('building_railway').GetName]#!, on the coast also #bold [GetBuildingType('building_port').GetName]#!."
 berater_bauplan_infra_2: "\n• #bold [SCOPE.sState('berater_infra_2').GetName]#! needs more infrastructure than it has, which holds back every building there. Recommended: #bold [GetBuildingType('building_railway').GetName]#!, on the coast also #bold [GetBuildingType('building_port').GetName]#!."
 berater_gesetzplan_leibeigenschaft: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_leibeigenschaft_ziel').GetName]#!. Serfs are tied to the land and unavailable to your industry. Free peasants can take jobs in mines and factories."
 berater_gesetzplan_wirtschaft: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_wirtschaft_ziel').GetName]#!. Only a modern economic system lets private investment and industry grow properly."
 berater_gesetzplan_beamte: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_beamte_ziel').GetName]#!. Hereditary bureaucrats are expensive and inefficient. Appointed bureaucrats produce more bureaucracy."
 berater_gesetzplan_handel: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_handel_ziel').GetName]#!. Isolationism cuts you off from world trade. Imports would fix shortages and lower prices."
 berater_gesetzplan_schulen: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_schulen_ziel').GetName]#!. Without schools your population stays uneducated, which slows research and keeps pops out of qualified jobs."
 berater_gesetzplan_landsteuer: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_landsteuer_ziel').GetName]#!. Land-based taxation falls almost entirely on peasants. A broader tax base brings in much more revenue."
 berater_gesetzplan_verbrauchsteuer: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_verbrauchsteuer_ziel').GetName]#!. Your budget needs more money. Direct taxes raise more than consumption taxes alone."
 berater_gesetzplan_staatsbuergerschaft: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_staatsbuergerschaft_ziel').GetName]#!. Discriminated cultures are a main source of your unrest and secessionists. More rights for minorities relieve the pressure."
 berater_gesetzplan_polizei: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_polizei_ziel').GetName]#!. Without police the state can hardly contain unrest."
 berater_gesetzplan_arbeiterrechte: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_arbeiterrechte_ziel').GetName]#!. Regulatory bodies improve working conditions and thereby reduce radicals."
 berater_gesetzplan_sozialhilfe: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_sozialhilfe_ziel').GetName]#!. Poor laws support the poorest and lift the standard of living at the bottom."
 berater_gesetzplan_oeffentliche_schulen: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_oeffentliche_schulen_ziel').GetName]#!. Public schools raise literacy fastest, and your budget can afford them."
 berater_gesetzplan_kinderarbeit: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_kinderarbeit_ziel').GetName]#!. Children in school instead of factories raises literacy and, in the long run, qualifications."
 berater_gesetzplan_gesundheit: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_gesundheit_ziel').GetName]#!. Charity hospitals lower mortality and let your population grow faster."
 berater_gesetzplan_armee: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_armee_ziel').GetName]#!. Peasant levies drain workers from the economy in wartime. A professional army fights better."
 berater_gesetzplan_vielvoelker: "\n• Enact #bold [SCOPE.sLaw('berater_gesetz_vielvoelker_ziel').GetName]#!. Secessionists are gaining ground. Full citizenship for all cultures removes their reason to revolt."
 berater_gesetzplan_regierung_1: "\n• #bold [SCOPE.sLaw('berater_gesetz_reg_1').GetName]#!"
 berater_gesetzplan_regierung_2: "\n• #bold [SCOPE.sLaw('berater_gesetz_reg_2').GetName]#!"
