 je_berater_status_engpaesse: "\n• Warning: Goods Shortages"
 berater_bericht_engpaesse: "\n\n• Goods Shortages\nYour market lacks goods that buildings need as inputs. This lowers their productivity and drives prices up.\nAdvice: Open the market view and sort by shortage. Build production for the missing goods or secure imports through trade routes."
