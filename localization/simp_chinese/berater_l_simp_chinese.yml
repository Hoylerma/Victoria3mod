 je_berater_status_gold_ungenutzt: "\n• Tip: Gold Reserves Nearly Full"
 berater_bericht_gold_ungenutzt: "\n\n• Gold Reserves Nearly Full\nYour gold reserves are close to their maximum. Any surplus beyond that is wasted.\nAdvice: Put the money to work: more construction sectors, subsidies for key industries, higher government wages or lower taxes."
