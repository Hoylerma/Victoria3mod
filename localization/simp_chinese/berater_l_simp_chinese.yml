 je_berater_status_industriegueter_teuer: "\n• Tip: Industrial Goods Expensive"
 berater_bericht_industriegueter_teuer: "\n\n• Industrial Goods Expensive\nAt least one key industrial good (coal, iron, wood, tools or steel) costs more than 25 % above its base price. This holds back your whole industry.\nAdvice: Build mines, logging camps, tooling workshops or steel mills for the expensive good. Cheap raw materials make every downstream building more profitable."
