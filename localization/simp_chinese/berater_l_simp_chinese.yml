 je_berater_status_arbeitslosigkeit: "\n• Warning: High Unemployment"
 berater_bericht_arbeitslosigkeit: "\n\n• High Unemployment\nIn at least one larger state more than 15 % of the workforce is unemployed. The unemployed grow poor and turn radical.\nAdvice: Build buildings there that employ many workers (agriculture, mines, factories) and whose goods are in demand. Good infrastructure and market access help."
