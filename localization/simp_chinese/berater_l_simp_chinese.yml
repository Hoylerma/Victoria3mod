 je_berater_status_lebensstandard: "\n• Warning: Expectations Unmet"
 berater_bericht_lebensstandard: "\n\n• Expectations Unmet\nMore than 30 % of your population lives below the standard of living they expect. This creates radicals.\nAdvice: Lower the price of basic goods (grain, fabric, wood, furniture) through more production or imports, and strengthen wages and welfare laws."
 alert_berater_lebensstandard_name: "Expectations Unmet"
 alert_berater_lebensstandard_desc: "More than 30 % of your population lives below the standard of living they expect. This creates radicals."
