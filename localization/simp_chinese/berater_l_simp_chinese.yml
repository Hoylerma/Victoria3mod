 je_berater_status_forschung: "\n• Tip: No Active Research"
 berater_bericht_forschung: "\n\n• No Active Research\nYou are not researching any technology. Every week without a research goal wastes innovation.\nAdvice: Pick a goal in the technology view. Good priorities: production technologies for your key industries, railways, and administration and education technologies."
 je_berater_status_bau_leer: "\n• Tip: Construction Idle"
 berater_bericht_bau_leer: "\n\n• Construction Idle\nYour government construction queue is empty. The construction capacity you pay for goes unused.\nAdvice: Queue new projects: buildings for scarce or expensive goods, infrastructure in states with bottlenecks, or more construction sectors to build faster in the future."
 je_berater_status_bau_lang: "\n• Tip: Construction Queue Too Long"
 berater_bericht_bau_lang: "\n\n• Construction Queue Too Long\nIt will take more than two years to finish all government construction projects.\nAdvice: Build additional construction sectors if your budget allows, switch to better construction production methods, or reorder the queue by priority."
 alert_berater_bau_lang_name: "Construction Queue Too Long"
 alert_berater_bau_lang_desc: "It will take more than two years to finish all government construction projects."
