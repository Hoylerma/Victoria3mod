 je_berater_status_alphabetisierung: "\n• Tip: Low Literacy"
 berater_bericht_alphabetisierung: "\n\n• Low Literacy\nLess than a quarter of your population can read. This slows research and keeps pops out of qualified professions.\nAdvice: Enact better school laws (e.g. public schools), invest in the schools institution and research education technologies."
