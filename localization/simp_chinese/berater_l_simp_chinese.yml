 je_berater_status_legitimitaet: "\n• Warning: Government Barely Legitimate"
 berater_bericht_legitimitaet: "\n\n• Government Barely Legitimate\nYour government's legitimacy is very low. Laws are harder to pass and the government is losing support.\nAdvice: Reshuffle the government: include interest groups whose ideology fits your form of government, and rely on a few strong governing parties."
 alert_berater_legitimitaet_name: "Government Barely Legitimate"
