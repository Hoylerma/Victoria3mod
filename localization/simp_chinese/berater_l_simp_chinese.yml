 je_berater_status_abspaltung: "\n• Warning: Secessionists Growing"
 berater_bericht_abspaltung: "\n\n• Secessionists Growing\nA secessionist movement is growing in your country. If it becomes strong enough, a war of secession will break out.\nAdvice: Improve the situation of the affected culture: relax citizenship and culture laws, raise the standard of living and reduce turmoil in the affected states."
