 je_berater_status_infamie_hoch: "\n• Warning: High Infamy"
 berater_bericht_infamie_hoch: "\n\n• High Infamy\nYour infamy has reached the notorious level. Further conquests may trigger coalitions against you.\nAdvice: Pause aggressive war goals and let your infamy decay before starting your next expansion."
