 je_berater_status_gesetze: "\n• Tip: No Law Being Enacted"
 berater_bericht_gesetze: "\n\n• No Law Being Enacted\nYou are not enacting any law right now. Reforms are among the strongest levers for the economy and stability.\nAdvice: Check in the politics view which laws your governing parties support. Tax, trade, education and labor laws are especially effective economically."
