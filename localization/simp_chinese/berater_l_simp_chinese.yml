 je_berater_status_steuern_hoch: "\n• Tip: Taxes Could Be Lowered"
 berater_bericht_steuern_hoch: "\n\n• Taxes Could Be Lowered\nYour taxes are high even though the budget is healthy. High taxes depress the standard of living and growth.\nAdvice: Lower the tax level by one step and watch your weekly balance. A higher standard of living brings more loyalists and growth."
