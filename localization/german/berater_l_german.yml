 je_berater_status_gesetze: "\n• Tipp: Kein Gesetz in Arbeit"
 berater_bericht_gesetze: "\n\n• #bold Kein Gesetz in Arbeit#!\nDerzeit bringst du kein Gesetz auf den Weg. Reformen gehören zu den stärksten Hebeln für Wirtschaft und Stabilität.\nRat: Öffne im Journal den Gesetzesplan: Der Berater empfiehlt dir konkrete Gesetze und sagt, ob deine Regierung sie mitträgt."
