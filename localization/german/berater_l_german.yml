 je_berater_status_ig_wuetend: "\n• Warnung: Mächtige Interessengruppe wütend"
 berater_bericht_ig_wuetend: "\n\n• Mächtige Interessengruppe wütend\nEine einflussreiche Interessengruppe ist wütend auf deine Regierung. Sie kann radikal werden und revolutionäre Bewegungen unterstützen.\nRat: Prüfe in der Politikansicht, welche Gesetze die Gruppe ablehnt. Nimm sie in die Regierung auf, erfülle eine ihrer Forderungen oder schwäche sie gezielt durch Unterdrückung."
