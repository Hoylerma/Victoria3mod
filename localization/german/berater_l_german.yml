 je_berater_status_industriegueter_teuer: "\n• Tipp: Industriegüter teuer"
 berater_bericht_industriegueter_teuer: "\n\n• #bold Industriegüter teuer#!\nMindestens ein wichtiges Industriegut (Kohle, Eisen, Holz, Werkzeuge oder Stahl) kostet über 25 % mehr als der Grundpreis. Das bremst die ganze Industrie.\nRat: Öffne im Journal den Bauplan: Der Berater nennt dir für jedes teure Gut das passende Gebäude und den besten Staat dafür."
