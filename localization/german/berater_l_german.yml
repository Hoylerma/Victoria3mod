 berater_bauplan_automobiles_kein_ort: "\n• #bold Automobile#! kostet #bold [ROOT.GetCountry.MakeScope.ScriptValue('berater_preis_automobiles')|%0]#! mehr als der Grundpreis, aber in keinem deiner Staaten ist #bold [GetBuildingType('building_automotive_industry').GetName]#! möglich. Sichere dir Importe über Handelsrouten."
 berater_bauplan_infra_1: "\n• #bold [SCOPE.sState('berater_infra_1').GetName]#! braucht mehr Infrastruktur, als vorhanden ist. Das bremst dort alle Betriebe. Empfehlung: #bold [GetBuildingType('building_railway').GetName]#!, an der Küste auch #bold [GetBuildingType('building_port').GetName]#!."
 berater_bauplan_infra_2: "\n• #bold [SCOPE.sState('berater_infra_2').GetName]#! braucht mehr Infrastruktur, als vorhanden ist. Das bremst dort alle Betriebe. Empfehlung: #bold [GetBuildingType('building_railway').GetName]#!, an der Küste auch #bold [GetBuildingType('building_port').GetName]#!."
 berater_gesetzplan_leibeigenschaft: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_leibeigenschaft_ziel').GetName]#!. Leibeigene sind an das Land gebunden und fehlen deiner Industrie. Freie Bauern können in Minen und Fabriken arbeiten."
 berater_gesetzplan_wirtschaft: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_wirtschaft_ziel').GetName]#!. Erst eine moderne Wirtschaftsordnung lässt private Investitionen und Industrie richtig wachsen."
 berater_gesetzplan_beamte: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_beamte_ziel').GetName]#!. Erbliche Beamte sind teuer und ineffizient. Ernannte Beamte erzeugen mehr Bürokratie."
 berater_gesetzplan_handel: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_handel_ziel').GetName]#!. Isolationismus schneidet dich vom Welthandel ab. Importe würden Engpässe beheben und Preise senken."
 berater_gesetzplan_schulen: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_schulen_ziel').GetName]#!. Ohne Schulen bleibt die Bevölkerung ungebildet. Das bremst die Forschung und den Aufstieg in qualifizierte Berufe."
 berater_gesetzplan_landsteuer: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_landsteuer_ziel').GetName]#!. Die Landsteuer belastet fast nur die Bauern. Eine breitere Steuerbasis bringt deutlich mehr Einnahmen."
 berater_gesetzplan_verbrauchsteuer: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_verbrauchsteuer_ziel').GetName]#!. Dein Haushalt braucht mehr Geld. Direkte Steuern bringen mehr ein als reine Verbrauchsteuern."
 berater_gesetzplan_staatsbuergerschaft: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_staatsbuergerschaft_ziel').GetName]#!. Diskriminierte Kulturen sind eine Hauptquelle deiner Unruhe und Separatisten. Mehr Rechte für Minderheiten nehmen den Druck heraus."
 berater_gesetzplan_polizei: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_polizei_ziel').GetName]#!. Ohne Polizei kann der Staat Unruhe kaum eindämmen."
 berater_gesetzplan_arbeiterrechte: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_arbeiterrechte_ziel').GetName]#!. Aufsichtsbehörden verbessern die Arbeitsbedingungen und senken so die Zahl der Radikalen."
 berater_gesetzplan_sozialhilfe: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_sozialhilfe_ziel').GetName]#!. Armengesetze fangen die Ärmsten auf und heben den Lebensstandard am unteren Ende."
 berater_gesetzplan_oeffentliche_schulen: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_oeffentliche_schulen_ziel').GetName]#!. Öffentliche Schulen heben die Alphabetisierung am schnellsten. Dein Haushalt kann sich das leisten."
 berater_gesetzplan_kinderarbeit: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_kinderarbeit_ziel').GetName]#!. Kinder in die Schule statt in die Fabrik: Das steigert die Alphabetisierung und langfristig die Qualifikation."
 berater_gesetzplan_gesundheit: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_gesundheit_ziel').GetName]#!. Armenhospitäler senken die Sterblichkeit und lassen die Bevölkerung schneller wachsen."
 berater_gesetzplan_armee: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_armee_ziel').GetName]#!. Bauernaufgebote ziehen im Krieg Arbeitskräfte aus der Wirtschaft ab. Eine Berufsarmee ist schlagkräftiger."
 berater_gesetzplan_vielvoelker: "\n• Verabschiede #bold [SCOPE.sLaw('berater_gesetz_vielvoelker_ziel').GetName]#!. Separatisten gewinnen an Boden. Volle Bürgerrechte für alle Kulturen nehmen ihnen den Grund zum Aufstand."
 berater_gesetzplan_regierung_1: "\n• #bold [SCOPE.sLaw('berater_gesetz_reg_1').GetName]#!"
 berater_gesetzplan_regierung_2: "\n• #bold [SCOPE.sLaw('berater_gesetz_reg_2').GetName]#!"
 berater_gesetzplan_regierung_3: "\n• #bold [SCOPE.sLaw('berater_gesetz_reg_3').GetName]#!"
