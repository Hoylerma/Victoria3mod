 je_berater_status_defizit: "\n• Warnung: Haushaltsdefizit"
 berater_bericht_defizit: "\n\n• Haushaltsdefizit\nDein Staat gibt jede Woche mehr aus, als er einnimmt, und die Goldreserven sind fast aufgebraucht. Bald müssen Kredite aufgenommen werden.\nRat: Erhöhe Steuern oder Zölle, senke Beamten- oder Militärgehälter oder verringere die Bauausgaben. Prüfe auch teure Gesetze wie Subventionen und Sozialprogramme."
 alert_berater_defizit_name: "Haushaltsdefizit"
