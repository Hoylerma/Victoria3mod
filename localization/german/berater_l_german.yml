 berater_bericht_engpaesse: "\n\n• #bold Güterknappheit#!\nIn deinem Markt fehlen Güter, die Betriebe als Vorprodukte brauchen. Das senkt ihre Produktivität und treibt die Preise.\nRat: Der Bauplan im Journal nennt dir, was du wo bauen solltest. Alternativ helfen Importe über Handelsrouten."
