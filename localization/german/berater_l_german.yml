 je_berater_status_infamie_paria: "\n• Akut: Paria-Staat"
 berater_bericht_infamie_paria: "\n\n• Paria-Staat\nDeine Infamie ist so hoch, dass andere Mächte jeden Vorwand nutzen werden, um gegen dich vorzugehen.\nRat: Verzichte auf weitere Eroberungen und aggressive Forderungen, bis die Infamie gesunken ist. Suche Verbündete und Verteidigungspakte."
