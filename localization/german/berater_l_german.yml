 je_berater_status_industriegueter_teuer: "\n• Tipp: Industriegüter teuer"
 berater_bericht_industriegueter_teuer: "\n\n• Industriegüter teuer\nMindestens ein wichtiges Industriegut (Kohle, Eisen, Holz, Werkzeuge oder Stahl) kostet über 25 % mehr als der Grundpreis. Das bremst die ganze Industrie.\nRat: Baue Minen, Holzfällerlager, Werkzeug- oder Stahlwerke für das teure Gut. Billige Grundstoffe machen alle weiterverarbeitenden Betriebe profitabler."
