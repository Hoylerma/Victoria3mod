 je_berater_status_steuern_hoch: "\n• Tipp: Steuern senkbar"
 berater_bericht_steuern_hoch: "\n\n• Steuern senkbar\nDeine Steuern sind hoch, obwohl der Haushalt gut dasteht. Hohe Steuern drücken den Lebensstandard und das Wachstum.\nRat: Senke die Steuerstufe um eine Stufe und beobachte die Wochenbilanz. Ein höherer Lebensstandard bringt mehr Loyalisten und Wachstum."
