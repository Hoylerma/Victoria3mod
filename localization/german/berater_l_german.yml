 je_berater_status_revolution: "\n• Akut: Revolution droht"
 berater_bericht_revolution: "\n\n• Revolution droht\nMindestens eine politische Bewegung ist revolutionär geworden. Sammelt sie genug Unterstützung, bricht ein Bürgerkrieg aus.\nRat: Gib der Bewegung nach, indem du ein Gesetz in ihrem Sinn einleitest, oder schwäche sie: unterdrücke die unterstützenden Interessengruppen, hebe den Lebensstandard und brich Gesetzesvorhaben ab, die sie ablehnt. Halte die Armee bereit."
 alert_berater_revolution_name: "Revolution droht"
 alert_berater_revolution_desc: "Mindestens eine politische Bewegung ist revolutionär geworden. Sammelt sie genug Unterstützung, bricht ein Bürgerkrieg aus."
