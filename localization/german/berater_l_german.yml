 berater_infamie_paria_setting_name: "Der Berater: Paria-Staat"
 je_berater_status_schulden_hoch: "\n• Warnung: Hohe Staatsschulden"
 berater_bericht_schulden_hoch: "\n\n• #bold Hohe Staatsschulden#!\nDeine Schulden betragen mehr als die Hälfte der Kreditgrenze. Die Zinsen belasten den Haushalt immer stärker.\nRat: Strebe einen Haushaltsüberschuss an, um die Schulden abzubauen: Steuern maßvoll erhöhen, Ausgaben prüfen und nur Bauvorhaben mit hoher Rendite (Industrie, Bergbau, Eisenbahn) fortsetzen."
 alert_berater_schulden_hoch_name: "Hohe Staatsschulden"
 alert_berater_schulden_hoch_desc: "Deine Schulden betragen mehr als die Hälfte der Kreditgrenze. Die Zinsen belasten den Haushalt immer stärker."
 alert_berater_schulden_hoch_hint: "Rat: Strebe einen Haushaltsüberschuss an, um die Schulden abzubauen: Steuern maßvoll erhöhen, Ausgaben prüfen und nur Bauvorhaben mit hoher Rendite (Industrie, Bergbau, Eisenbahn) fortsetzen."
 alert_berater_schulden_hoch_action: "Mehr dazu im Journal unter „Der Berater“."
 berater_schulden_hoch_setting_name: "Der Berater: Hohe Staatsschulden"
 je_berater_status_defizit: "\n• Warnung: Haushaltsdefizit"
 berater_bericht_defizit: "\n\n• #bold Haushaltsdefizit#!\nDein Staat gibt jede Woche mehr aus, als er einnimmt, und die Goldreserven sind fast aufgebraucht. Bald müssen Kredite aufgenommen werden.\nRat: Erhöhe Steuern oder Zölle, senke Beamten- oder Militärgehälter oder verringere die Bauausgaben. Prüfe auch teure Gesetze wie Subventionen und Sozialprogramme."
 alert_berater_defizit_name: "Haushaltsdefizit"
 alert_berater_defizit_desc: "Dein Staat gibt jede Woche mehr aus, als er einnimmt, und die Goldreserven sind fast aufgebraucht. Bald müssen Kredite aufgenommen werden."
 alert_berater_defizit_hint: "Rat: Erhöhe Steuern oder Zölle, senke Beamten- oder Militärgehälter oder verringere die Bauausgaben. Prüfe auch teure Gesetze wie Subventionen und Sozialprogramme."
 alert_berater_defizit_action: "Mehr dazu im Journal unter „Der Berater“."
 berater_defizit_setting_name: "Der Berater: Haushaltsdefizit"
 je_berater_status_buerokratie: "\n• Warnung: Bürokratie im Minus"
 berater_bericht_buerokratie: "\n\n• #bold Bürokratie im Minus#!\nDu verbrauchst mehr Bürokratie, als deine Verwaltung erzeugt. Das senkt die Steuereinnahmen und verlangsamt die Eingliederung neuer Staaten.\nRat: Baue Regierungsverwaltungen in Staaten mit vielen gebildeten Arbeitskräften, stelle Gesetze und Institutionen mit hohem Bürokratieverbrauch zurück oder wähle bessere Produktionsmethoden für die Verwaltungen."
 je_berater_status_autoritaet: "\n• Warnung: Autorität im Minus"
 berater_bericht_autoritaet: "\n\n• #bold Autorität im Minus#!\nErlasse, Zölle und Gesetze verbrauchen mehr Autorität, als du hast. Dadurch verlieren alle Autoritätsausgaben an Wirkung.\nRat: Hebe weniger wichtige Erlasse auf, beschränke Zölle und Handelsvorgaben auf wenige Güter oder stärke die Autorität über Gesetze und Technologien."
 je_berater_status_einfluss: "\n• Warnung: Einfluss im Minus"
 berater_bericht_einfluss: "\n\n• #bold Einfluss im Minus#!\nDeine diplomatischen Verpflichtungen kosten mehr Einfluss, als du erzeugst. Das schwächt deine Diplomatie.\nRat: Kündige unwichtige Pakte und gib Interessen in Regionen auf, die du nicht brauchst. Steigere den Einfluss über Gesetze, Technologien und einen höheren Rang."
 je_berater_status_unruhe: "\n• Warnung: Unruhe in deinen Staaten"
 berater_bericht_unruhe: "\n\n• #bold Unruhe in deinen Staaten#!\nIn mindestens einem deiner Staaten herrscht starke Unruhe. Das senkt die Produktivität und kann zu Aufständen führen.\nRat: Prüfe die betroffenen Staaten in der Bevölkerungsansicht: Arbeitslosigkeit, ein niedriger Lebensstandard und diskriminierte Kulturen sind die häufigsten Ursachen. Schaffe Arbeitsplätze und verbessere die Versorgung mit Grundgütern."
 berater_bericht_unruhe_detail: "\nAm stärksten betroffen: #bold [SCOPE.sState('berater_ort_unruhe').GetName]#!."
 alert_berater_unruhe_name: "Unruhe in deinen Staaten"
 alert_berater_unruhe_desc: "In mindestens einem deiner Staaten herrscht starke Unruhe. Das senkt die Produktivität und kann zu Aufständen führen."
 alert_berater_unruhe_hint: "Rat: Prüfe die betroffenen Staaten in der Bevölkerungsansicht: Arbeitslosigkeit, ein niedriger Lebensstandard und diskriminierte Kulturen sind die häufigsten Ursachen. Schaffe Arbeitsplätze und verbessere die Versorgung mit Grundgütern."
 alert_berater_unruhe_action: "Mehr dazu im Journal unter „Der Berater“."
 berater_unruhe_setting_name: "Der Berater: Unruhe in deinen Staaten"
 je_berater_status_radikale: "\n• Warnung: Viele Radikale"
 berater_bericht_radikale: "\n\n• #bold Viele Radikale#!\nMehr als 20 % deiner Bevölkerung sind radikal. Radikale stärken revolutionäre Bewegungen und schwächen die Regierung.\nRat: Hebe den Lebensstandard (günstigere Grundgüter, höhere Löhne), senke die Steuerlast der Unterschicht und gehe auf die Forderungen unzufriedener Interessengruppen ein."
 alert_berater_radikale_name: "Viele Radikale"
 alert_berater_radikale_desc: "Mehr als 20 % deiner Bevölkerung sind radikal. Radikale stärken revolutionäre Bewegungen und schwächen die Regierung."
 alert_berater_radikale_hint: "Rat: Hebe den Lebensstandard (günstigere Grundgüter, höhere Löhne), senke die Steuerlast der Unterschicht und gehe auf die Forderungen unzufriedener Interessengruppen ein."
 alert_berater_radikale_action: "Mehr dazu im Journal unter „Der Berater“."
 berater_radikale_setting_name: "Der Berater: Viele Radikale"
 je_berater_status_ig_wuetend: "\n• Warnung: Mächtige Interessengruppe wütend"
 berater_bericht_ig_wuetend: "\n\n• #bold Mächtige Interessengruppe wütend#!\nEine einflussreiche Interessengruppe ist wütend auf deine Regierung. Sie kann radikal werden und revolutionäre Bewegungen unterstützen.\nRat: Prüfe in der Politikansicht, welche Gesetze die Gruppe ablehnt. Nimm sie in die Regierung auf, erfülle eine ihrer Forderungen oder schwäche sie gezielt durch Unterdrückung."
 berater_bericht_ig_wuetend_detail: "\nAm wütendsten ist #bold [SCOPE.gsInterestGroup('berater_ig_wuetend').GetName]#!."
 alert_berater_ig_wuetend_name: "Mächtige Interessengruppe wütend"
 alert_berater_ig_wuetend_desc: "Eine einflussreiche Interessengruppe ist wütend auf deine Regierung. Sie kann radikal werden und revolutionäre Bewegungen unterstützen."
 alert_berater_ig_wuetend_hint: "Rat: Prüfe in der Politikansicht, welche Gesetze die Gruppe ablehnt. Nimm sie in die Regierung auf, erfülle eine ihrer Forderungen oder schwäche sie gezielt durch Unterdrückung."
 alert_berater_ig_wuetend_action: "Mehr dazu im Journal unter „Der Berater“."
 berater_ig_wuetend_setting_name: "Der Berater: Mächtige Interessengruppe wütend"
 je_berater_status_arbeitslosigkeit: "\n• Warnung: Hohe Arbeitslosigkeit"
 berater_bericht_arbeitslosigkeit: "\n\n• #bold Hohe Arbeitslosigkeit#!\nIn mindestens einem größeren Staat sind über 15 % der Arbeitskräfte ohne Arbeit. Arbeitslose verarmen und werden radikal.\nRat: Baue dort Gebäude mit vielen Arbeitsplätzen (Landwirtschaft, Minen, Fabriken), für deren Güter es Nachfrage gibt. Gute Infrastruktur und Marktzugang helfen dabei."
 berater_bericht_arbeitslosigkeit_detail: "\nDie meisten Arbeitslosen gibt es in #bold [SCOPE.sState('berater_ort_arbeitslos').GetName]#!. Der Bauplan bevorzugt solche Staaten."
