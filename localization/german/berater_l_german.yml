 je_berater_status_engpaesse: "\n• Warnung: Güterknappheit"
 berater_bericht_engpaesse: "\n\n• Güterknappheit\nIn deinem Markt fehlen Güter, die Betriebe als Vorprodukte brauchen. Das senkt ihre Produktivität und treibt die Preise.\nRat: Öffne die Marktansicht und sortiere nach Knappheit. Baue Produktionsstätten für die fehlenden Güter oder sichere Importe über Handelsrouten."
