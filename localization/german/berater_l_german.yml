 je_berater_status_kriegsunterstuetzung: "\n• Akut: Kriegsunterstützung im Minus"
 berater_bericht_kriegsunterstuetzung: "\n\n• Kriegsunterstützung im Minus\nIn mindestens einem Krieg ist die Kriegsunterstützung deines Landes unter null gefallen. Bei -100 musst du kapitulieren.\nRat: Biete jetzt einen Frieden mit wenigen Kriegszielen an oder nimm ein vernünftiges Angebot an, bevor du zur Kapitulation gezwungen wirst. Die Besetzung gegnerischer Kriegsziele stabilisiert die eigene Kriegsunterstützung."
