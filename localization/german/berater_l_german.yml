 je_berater_status_legitimitaet: "\n• Warnung: Regierung kaum legitim"
 berater_bericht_legitimitaet: "\n\n• #bold Regierung kaum legitim#!\nDie Legitimität deiner Regierung ist sehr niedrig. Gesetze lassen sich schwerer verabschieden, und die Regierung verliert Rückhalt.\nRat: Bilde die Regierung um: Nimm Interessengruppen auf, deren Ideologie zu deiner Staatsform passt, und setze auf wenige, starke Regierungsparteien."
