 je_berater_status_alphabetisierung: "\n• Tipp: Niedrige Alphabetisierung"
 berater_bericht_alphabetisierung: "\n\n• Niedrige Alphabetisierung\nWeniger als ein Viertel deiner Bevölkerung kann lesen. Das bremst die Forschung und den Aufstieg in qualifizierte Berufe.\nRat: Führe bessere Schulgesetze ein (z. B. öffentliche Schulen), investiere in die Institution Schulen und erforsche Bildungstechnologien."
