 je_berater_status_gold_ungenutzt: "\n• Tipp: Goldreserven fast voll"
 berater_bericht_gold_ungenutzt: "\n\n• #bold Goldreserven fast voll#!\nDeine Goldreserven sind beinahe am Maximum. Überschüsse darüber hinaus verfallen ungenutzt.\nRat: Investiere das Geld: mehr Bausektoren, Subventionen für wichtige Industrien, höhere Beamtengehälter oder niedrigere Steuern."
