 je_berater_status_bankrott: "\n• Akut: Staatsbankrott"
 berater_bericht_bankrott: "\n\n• Staatsbankrott\nDein Staat ist zahlungsunfähig. Bauvorhaben stocken, Gehälter fallen aus, und die Interessengruppen verlieren das Vertrauen in die Regierung.\nRat: Erhöhe sofort Steuern oder Zölle, senke Beamten- und Militärgehälter, demobilisiere überflüssige Truppen und streiche Subventionen. Stelle unrentable Bauvorhaben zurück, bis die Wochenbilanz wieder positiv ist."
 alert_berater_bankrott_name: "Staatsbankrott"
 alert_berater_bankrott_desc: "Dein Staat ist zahlungsunfähig. Bauvorhaben stocken, Gehälter fallen aus, und die Interessengruppen verlieren das Vertrauen in die Regierung."
 alert_berater_bankrott_hint: "Rat: Erhöhe sofort Steuern oder Zölle, senke Beamten- und Militärgehälter, demobilisiere überflüssige Truppen und streiche Subventionen. Stelle unrentable Bauvorhaben zurück, bis die Wochenbilanz wieder positiv ist."
 alert_berater_bankrott_action: "Mehr dazu im Journal unter „Der Berater“."
 berater_bankrott_setting_name: "Der Berater: Staatsbankrott"
 je_berater_status_schulden_kritisch: "\n• Akut: Schulden am Limit"
 berater_bericht_schulden_kritisch: "\n\n• Schulden am Limit\nDeine Schulden haben über 80 % der Kreditgrenze erreicht. Bei 100 % droht der Staatsbankrott.\nRat: Bringe den Haushalt sofort ins Plus: Steuern oder Zölle anheben, Gehälter senken und teure Bauvorhaben zurückstellen. Jeder weitere Kredit verteuert die Zinsen."
