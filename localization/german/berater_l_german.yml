 je_berater_status_gesetze: "\n• Tipp: Kein Gesetz in Arbeit"
 berater_bericht_gesetze: "\n\n• Kein Gesetz in Arbeit\nDerzeit bringst du kein Gesetz auf den Weg. Reformen gehören zu den stärksten Hebeln für Wirtschaft und Stabilität.\nRat: Prüfe in der Politikansicht, welche Gesetze deine Regierungsparteien unterstützen. Wirtschaftlich besonders wirksam sind Steuer-, Handels-, Bildungs- und Arbeitsgesetze."
