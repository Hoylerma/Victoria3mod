 berater_kriegsunterstuetzung_setting_name: "Der Berater: Kriegsunterstützung im Minus"
 je_berater_status_infamie_paria: "\n• Akut: Paria-Staat"
 berater_bericht_infamie_paria: "\n\n• #bold Paria-Staat#!\nDeine Infamie ist so hoch, dass andere Mächte jeden Vorwand nutzen werden, um gegen dich vorzugehen.\nRat: Verzichte auf weitere Eroberungen und aggressive Forderungen, bis die Infamie gesunken ist. Suche Verbündete und Verteidigungspakte."
 alert_berater_infamie_paria_name: "Paria-Staat"
 alert_berater_infamie_paria_desc: "Deine Infamie ist so hoch, dass andere Mächte jeden Vorwand nutzen werden, um gegen dich vorzugehen."
 alert_berater_infamie_paria_hint: "Rat: Verzichte auf weitere Eroberungen und aggressive Forderungen, bis die Infamie gesunken ist. Suche Verbündete und Verteidigungspakte."
