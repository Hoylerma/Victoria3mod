 je_berater_status_arbeitslosigkeit: "\n• Warnung: Hohe Arbeitslosigkeit"
 berater_bericht_arbeitslosigkeit: "\n\n• Hohe Arbeitslosigkeit\nIn mindestens einem größeren Staat sind über 15 % der Arbeitskräfte ohne Arbeit. Arbeitslose verarmen und werden radikal.\nRat: Baue dort Gebäude mit vielen Arbeitsplätzen (Landwirtschaft, Minen, Fabriken), für deren Güter es Nachfrage gibt. Gute Infrastruktur und Marktzugang helfen dabei."
