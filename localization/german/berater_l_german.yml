 je_berater_status_abspaltung: "\n• Warnung: Separatisten im Aufwind"
 berater_bericht_abspaltung: "\n\n• Separatisten im Aufwind\nIn deinem Land wächst eine Abspaltungsbewegung. Wird sie stark genug, bricht ein Sezessionskrieg aus.\nRat: Verbessere die Lage der betroffenen Kultur: Gesetze zu Staatsbürgerschaft und Kultur lockern, den Lebensstandard heben und die Unruhe in den betroffenen Staaten senken."
