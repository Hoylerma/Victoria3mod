 berater_bericht_infamie_hoch: "\n\n• Hohe Infamie\nDeine Infamie hat die Stufe „berüchtigt“ erreicht. Weitere Eroberungen können Koalitionen gegen dich auslösen.\nRat: Lege eine Pause bei aggressiven Kriegszielen ein und lass die Infamie sinken, bevor du die nächste Expansion beginnst."
