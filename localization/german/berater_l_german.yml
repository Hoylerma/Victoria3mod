 je_berater_status_schulden_hoch: "\n• Warnung: Hohe Staatsschulden"
 berater_bericht_schulden_hoch: "\n\n• Hohe Staatsschulden\nDeine Schulden betragen mehr als die Hälfte der Kreditgrenze. Die Zinsen belasten den Haushalt immer stärker.\nRat: Strebe einen Haushaltsüberschuss an, um die Schulden abzubauen: Steuern maßvoll erhöhen, Ausgaben prüfen und nur Bauvorhaben mit hoher Rendite (Industrie, Bergbau, Eisenbahn) fortsetzen."
