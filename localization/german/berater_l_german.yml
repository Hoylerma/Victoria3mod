 je_berater_status_lebensstandard: "\n• Warnung: Erwartungen enttäuscht"
 berater_bericht_lebensstandard: "\n\n• #bold Erwartungen enttäuscht#!\nMehr als 30 % deiner Bevölkerung leben unter dem Lebensstandard, den sie erwarten. Das erzeugt Radikale.\nRat: Senke die Preise für Grundgüter (Getreide, Stoffe, Holz, Möbel) durch mehr Produktion oder Importe, und stärke Löhne und Sozialgesetze."
