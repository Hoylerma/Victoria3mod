 je_berater_status_forschung: "\n• Tipp: Keine Forschung aktiv"
 berater_bericht_forschung: "\n\n• Keine Forschung aktiv\nDu erforschst gerade keine Technologie. Jede Woche ohne Forschungsziel verschwendet Innovation.\nRat: Wähle in der Technologieansicht ein Ziel. Gute Prioritäten: Produktionstechnologien für deine wichtigsten Industrien, Eisenbahn sowie Verwaltungs- und Bildungstechnologien."
 je_berater_status_bau_leer: "\n• Tipp: Bauwirtschaft untätig"
 berater_bericht_bau_leer: "\n\n• Bauwirtschaft untätig\nDeine staatliche Bauwarteschlange ist leer. Die Baukapazität, die du bezahlst, bleibt ungenutzt.\nRat: Plane neue Bauvorhaben: Betriebe für knappe oder teure Güter, Infrastruktur in Staaten mit Engpässen oder weitere Bausektoren, um künftig schneller zu bauen."
 je_berater_status_bau_lang: "\n• Tipp: Bauwarteschlange zu lang"
 berater_bericht_bau_lang: "\n\n• Bauwarteschlange zu lang\nBis alle staatlichen Bauvorhaben fertig sind, vergehen mehr als zwei Jahre.\nRat: Baue zusätzliche Bausektoren, sofern das Budget es zulässt, wechsle auf bessere Bau-Produktionsmethoden oder ordne die Warteschlange nach Wichtigkeit."
