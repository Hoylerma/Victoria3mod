 berater_defizit_setting_name: "Der Berater: Haushaltsdefizit"
 je_berater_status_buerokratie: "\n• Warnung: Bürokratie im Minus"
 berater_bericht_buerokratie: "\n\n• Bürokratie im Minus\nDu verbrauchst mehr Bürokratie, als deine Verwaltung erzeugt. Das senkt die Steuereinnahmen und verlangsamt die Eingliederung neuer Staaten.\nRat: Baue Regierungsverwaltungen in Staaten mit vielen gebildeten Arbeitskräften, stelle Gesetze und Institutionen mit hohem Bürokratieverbrauch zurück oder wähle bessere Produktionsmethoden für die Verwaltungen."
 je_berater_status_autoritaet: "\n• Warnung: Autorität im Minus"
 berater_bericht_autoritaet: "\n\n• Autorität im Minus\nErlasse, Zölle und Gesetze verbrauchen mehr Autorität, als du hast. Dadurch verlieren alle Autoritätsausgaben an Wirkung.\nRat: Hebe weniger wichtige Erlasse auf, beschränke Zölle und Handelsvorgaben auf wenige Güter oder stärke die Autorität über Gesetze und Technologien."
 je_berater_status_einfluss: "\n• Warnung: Einfluss im Minus"
 berater_bericht_einfluss: "\n\n• Einfluss im Minus\nDeine diplomatischen Verpflichtungen kosten mehr Einfluss, als du erzeugst. Das schwächt deine Diplomatie.\nRat: Kündige unwichtige Pakte und gib Interessen in Regionen auf, die du nicht brauchst. Steigere den Einfluss über Gesetze, Technologien und einen höheren Rang."
 je_berater_status_unruhe: "\n• Warnung: Unruhe in deinen Staaten"
 berater_bericht_unruhe: "\n\n• Unruhe in deinen Staaten\nIn mindestens einem deiner Staaten herrscht starke Unruhe. Das senkt die Produktivität und kann zu Aufständen führen.\nRat: Prüfe die betroffenen Staaten in der Bevölkerungsansicht: Arbeitslosigkeit, ein niedriger Lebensstandard und diskriminierte Kulturen sind die häufigsten Ursachen. Schaffe Arbeitsplätze und verbessere die Versorgung mit Grundgütern."
 alert_berater_unruhe_name: "Unruhe in deinen Staaten"
 alert_berater_unruhe_desc: "In mindestens einem deiner Staaten herrscht starke Unruhe. Das senkt die Produktivität und kann zu Aufständen führen."
 alert_berater_unruhe_hint: "Rat: Prüfe die betroffenen Staaten in der Bevölkerungsansicht: Arbeitslosigkeit, ein niedriger Lebensstandard und diskriminierte Kulturen sind die häufigsten Ursachen. Schaffe Arbeitsplätze und verbessere die Versorgung mit Grundgütern."
