 berater_unruhe_setting_name: "Der Berater: Unruhe in deinen Staaten"
 je_berater_status_radikale: "\n• Warnung: Viele Radikale"
 berater_bericht_radikale: "\n\n• Viele Radikale\nMehr als 20 % deiner Bevölkerung sind radikal. Radikale stärken revolutionäre Bewegungen und schwächen die Regierung.\nRat: Hebe den Lebensstandard (günstigere Grundgüter, höhere Löhne), senke die Steuerlast der Unterschicht und gehe auf die Forderungen unzufriedener Interessengruppen ein."
 alert_berater_radikale_name: "Viele Radikale"
